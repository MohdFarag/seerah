# The one place where versions are declared (ADR 0004). Dependabot keeps them current.
# Add an entry only when a module starts using it.

[versions]
# Build
androidGradlePlugin = "9.5.3"
kotlin = "2.4.21"
ksp = "2.3.14"
# Android SDK levels (ADR 0003)
compileSdk = "37"
compileSdkMinor = "2"
targetSdk = "37"
minSdk = "26"
# Libraries
androidxActivity = "1.13.0"
androidxComposeBom = "2026.11.01"
androidxCore = "1.18.0"
androidxLifecycle = "2.11.0"
androidxTestCore = "1.7.0"
androidxTestEspresso = "3.7.0"
androidxTestExt = "1.3.0"
hilt = "2.60.1"
junit4 = "4.13.2"
