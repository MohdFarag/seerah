kotlinxSerialization = "1.13.0"
leakcanary = "2.14"
maplibre = "13.7.1"
robolectric = "4.18.1"
room3 = "3.0.3"
sqlite = "2.7.1"
tink = "1.24.0"
# Quality tooling
composeRules = "0.6.8"
dependencyAnalysis = "3.20.4"
ktlint = "1.8.0"
licensee = "1.14.1"
