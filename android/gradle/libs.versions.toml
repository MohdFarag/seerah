# The one place where versions are declared (ADR 0004). Dependabot keeps them current.
# Add an entry only when a module starts using it.

[versions]
# Build
androidGradlePlugin = "9.5.1"
kotlin = "2.4.21"
ksp = "2.3.13"
# Android SDK levels (ADR 0003)
compileSdk = "37"
targetSdk = "37"
minSdk = "26"
# Libraries
androidxActivity = "1.13.0"
androidxComposeBom = "2026.09.00"
androidxLifecycle = "2.11.0"
androidxTestEspresso = "3.7.0"
androidxTestExt = "1.3.0"
hilt = "2.60.1"
junit4 = "4.13.2"
leakcanary = "2.14"
robolectric = "4.17"
# Quality tooling
composeRules = "0.6.8"
dependencyAnalysis = "3.20.2"
ktlint = "1.8.0"
licensee = "1.14.1"
moduleGraphAssert = "2.9.1"
spotless = "8.11.0"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime", version.ref = "androidxLifecycle" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidxTestEspresso" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExt" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
leakcanary = { group = "com.squareup.leakcanary", name = "leakcanary-android", version.ref = "leakcanary" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

# Gradle plugins used by build-logic
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "androidGradlePlugin" }
compose-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
hilt-gradlePlugin = { group = "com.google.dagger", name = "hilt-android-gradle-plugin", version.ref = "hilt" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "symbol-processing-gradle-plugin", version.ref = "ksp" }
licensee-gradlePlugin = { group = "app.cash.licensee", name = "licensee-gradle-plugin", version.ref = "licensee" }
moduleGraphAssert-gradlePlugin = { group = "com.jraska.module.graph.assertion", name = "com.jraska.module.graph.assertion.gradle.plugin", version.ref = "moduleGraphAssert" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
dependency-analysis = { id = "com.autonomousapps.dependency-analysis", version.ref = "dependencyAnalysis" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
licensee = { id = "app.cash.licensee", version.ref = "licensee" }
module-graph-assert = { id = "com.jraska.module.graph.assertion", version.ref = "moduleGraphAssert" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

# Convention plugins from build-logic (no version: they are part of this build)
seerah-android-application = { id = "seerah.android.application" }
seerah-android-application-compose = { id = "seerah.android.application.compose" }
seerah-hilt = { id = "seerah.hilt" }
