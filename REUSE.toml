# Licence of every file, following the REUSE specification (https://reuse.software).
# Code and documentation are Apache-2.0; content is all rights reserved (ADR 0006).
# Later entries override earlier ones for the paths they match.
version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Mohamed Farag"
SPDX-License-Identifier = "Apache-2.0"

# Content: Seerah data, story scripts and historical map data.
[[annotations]]
path = ["content/index/**", "content/events/**", "map-data/historical/**", "map-data/updates/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Mohamed Farag"
SPDX-License-Identifier = "LicenseRef-Seerah-Content"

# Fonts and the glyph files generated from them.
[[annotations]]
path = ["map-data/style/fonts/Amiri-*.ttf", "map-data/style/glyphs/Amiri-Regular/**"]
precedence = "override"
SPDX-FileCopyrightText = "2010-2022 The Amiri Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["map-data/style/fonts/IBMPlexSansArabic-*.ttf", "map-data/style/glyphs/PlexArabic-Regular/**"]
precedence = "override"
SPDX-FileCopyrightText = "2017 IBM Corp."
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["map-data/style/fonts/OFL-*.txt"]
precedence = "override"
SPDX-FileCopyrightText = ["2010-2022 The Amiri Project Authors", "2017 IBM Corp."]
SPDX-License-Identifier = "OFL-1.1"

# Gradle wrapper files, generated by Gradle.
[[annotations]]
path = ["**/gradlew", "**/gradlew.bat", "**/gradle/wrapper/gradle-wrapper.jar"]
precedence = "override"
SPDX-FileCopyrightText = "Gradle Inc."
SPDX-License-Identifier = "Apache-2.0"
