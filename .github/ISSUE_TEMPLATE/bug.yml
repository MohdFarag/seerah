name: Bug report
description: Something in the app doesn't work as expected
title: "fix: "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened?, description: And what did you expect? }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce, placeholder: "1. …\n2. …" }
    validations: { required: true }
  - type: input
    id: device
    attributes: { label: Device and Android version, placeholder: "e.g. Pixel 7, Android 15 / Galaxy Tab S9" }
  - type: dropdown
    id: network
    attributes: { label: Connection, options: [Online, Offline, Not sure] }
  - type: textarea
    id: extra
    attributes: { label: Screenshots or logs }
