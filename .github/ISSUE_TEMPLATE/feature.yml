name: Feature request
description: Suggest an idea or improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What need does this address? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposal }
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I checked docs/requirements.md ("Out of v1") and docs/open-decisions.md
