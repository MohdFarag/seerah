version: 2
# Every update waits 7 days after a release before it is proposed (cooldown), so a
# compromised or broken release has time to be caught upstream first.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: ci }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: pip
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: build }
  # The v1 app's version catalog (android/gradle/libs.versions.toml). The spike is not updated.
  - package-ecosystem: gradle
    directory: /android
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: build }
    groups:
      androidx: { patterns: ["androidx.*"] }
      kotlin: { patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*"] }
