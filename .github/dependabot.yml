version: 2
# Every update waits 7 days after a release before it is proposed (cooldown), so a
# compromised or broken release has time to be caught upstream first.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: ci }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: pip
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: build }
  # The map tool's toolchain image (tools/map/Dockerfile) and its hash-locked Python
  # packages (tools/map/requirements.txt). numpy must match the base image (requirements.in).
  - package-ecosystem: docker
    directory: /tools/map
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: build }
  - package-ecosystem: pip
    directory: /tools/map
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: build }
    # numpy comes from the base image's Ubuntu package, which pip cannot replace and
    # GDAL's bindings are built against. Its pin moves by hand when the docker entry
    # above updates the base image.
    ignore:
      - dependency-name: numpy
  - package-ecosystem: pip
    directory: /tools/content
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: build }
  # Host-side package signing and verification tool (tools/packages/requirements.txt).
  - package-ecosystem: pip
    directory: /tools/packages
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: build }
  # The v1 app's version catalog (android/gradle/libs.versions.toml). The spike is not updated.
  - package-ecosystem: gradle
    directory: /android
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    commit-message: { prefix: build }
    groups:
      androidx: { patterns: ["androidx.*"] }
      kotlin: { patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*"] }
