name: PR title
# `pull_request` (not `pull_request_target`): the check only reads the title, so it needs
# no write token, and code from forks never runs with this repository's secrets.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions: {}
jobs:
  conventional:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            content
            docs
            refactor
            perf
            test
            build
            ci
            chore
            revert
            style
