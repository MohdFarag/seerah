name: Spike APK
# The spike is finished (reference only), so its APKs are built on demand, not on every push.
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: spike-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The base map (land outline and relief) is too large for git, so it is
      # built here and cached until the pipeline changes.
      - name: Restore base map
        id: base
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: map-data/dist
          key: base-map-${{ hashFiles('tools/spike/build_base.sh', 'tools/spike/relief_style.py') }}

      - name: Install map tools
        if: steps.base.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin tippecanoe
          pip install --quiet numpy pmtiles

      - name: Build base map
        if: steps.base.outputs.cache-hit != 'true'
        run: bash tools/spike/build_base.sh

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build debug and release APKs
        working-directory: android/spike
        run: ./gradlew :spike:assembleDebug :spike:assembleRelease --console=plain

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spike-vulkan
          path: android/spike/spike/build/outputs/apk/vulkan/*/*.apk
          if-no-files-found: error
          compression-level: 0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spike-opengl
          path: android/spike/spike/build/outputs/apk/opengl/*/*.apk
          if-no-files-found: error
          compression-level: 0
