name: Android
on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths: ["android/**", "!android/spike/**", "tools/android/**", ".editorconfig", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "!android/spike/**", "tools/android/**", ".editorconfig", ".github/workflows/android.yml"]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      # Also validates the Gradle wrapper and caches Gradle between runs.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Formatting, lint (warnings fail), unit tests, module rules, dependency health, release build.
      - name: Check and build
        run: ./gradlew spotlessCheck check buildHealth assembleRelease --console=plain

      - name: 16 KB page alignment
        run: python3 ../tools/android/check_page_alignment.py app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seerah-app
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          compression-level: 0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: reports
          path: |
            android/**/build/reports/
            android/build/reports/
