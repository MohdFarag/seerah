name: Android spike
on:
  push:
    paths: ["spike/**", ".github/workflows/android-spike.yml"]
  pull_request:
    paths: ["spike/**", ".github/workflows/android-spike.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build test package
        working-directory: spike/pack
        run: |
          pip install -r requirements.txt
          ./prepare_sources.sh
          python3 build.py
      - name: Core tests
        working-directory: spike/android
        run: ./gradlew :core:test --console=plain
      - name: Build APKs
        working-directory: spike/android
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest --console=plain
      - name: Sizes
        run: |
          ls -l spike/android/app/build/outputs/apk/*/*.apk spike/android/app/build/outputs/apk/*/*/*.apk 2>/dev/null | tee apk-sizes.txt
          cat spike/pack/dist/size-report.txt | tee -a apk-sizes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: seerah-spike-apk
          path: |
            spike/android/app/build/outputs/apk/release/app-release.apk
            spike/android/app/build/outputs/apk/debug/app-debug.apk
            apk-sizes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: build-for-device-tests
          retention-days: 3
          path: |
            spike/android/app/build/outputs/apk/
            spike/pack/dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-report
          path: spike/android/core/build/reports/tests/

  device-tests:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: [pixel_6, pixel_tablet]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { name: build-for-device-tests, path: dl }
      - name: Place build outputs
        run: |
          # upload-artifact drops the common path prefix, so locate the folders instead of assuming it.
          apk=$(find dl -type d -path '*app/build/outputs/apk' | head -1)
          dist=$(find dl -type d -path '*pack/dist' | head -1)
          test -n "$apk" && test -n "$dist"
          mkdir -p spike/android/app/build/outputs
          cp -r "$apk" spike/android/app/build/outputs/
          cp -r "$dist" spike/pack/
          find spike/android/app/build/outputs -name '*.apk'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.device }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: spike/android
          script: OUT=../../device-results-${{ matrix.device }} ./ci/device-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-results-${{ matrix.device }}
          path: device-results-${{ matrix.device }}/
