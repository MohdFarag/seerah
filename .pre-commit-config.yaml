default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: \.bat$ # CRLF by design (.gitattributes)
      - id: no-commit-to-branch
        args: [--branch, main]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.1
    hooks:
      - id: markdownlint-cli2
        exclude: ^docs/prd/PRD-v0\.2\.ar\.md$   # verbatim Notion snapshot
  # Every file has a stated licence (REUSE.toml, ADR 0006).
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.3.0
    hooks:
      - id: reuse
  # GitHub Actions workflows: syntax and shell checks, then security audit.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor
        args: [--offline] # no GitHub token needed; deterministic locally and in CI
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, content, docs, refactor, perf, test, build, ci, chore, revert, style]
  - repo: local
    hooks:
      - id: validate-content
        name: validate content
        entry: python3 tools/validate_content.py
        language: python
        additional_dependencies: [jsonschema==4.26.0]
        files: ^(content/|tools/validate_content\.py)
        pass_filenames: false
